name: Unit tests

# Run explicitly before releases; avoid automatic Actions usage on pushes/PRs.
on:
  workflow_dispatch:

jobs:
  nexa-wal-logic:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Packages/NexaWalLogic
    steps:
      - uses: actions/checkout@v7
      - name: Run NexaWalLogic tests
        run: swift test
